<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ضبط ویدیو مسیج دایره‌ای</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 20px;
  }
  h1 { font-size: 20px; color: #DFDFDF; }
  #stage {
    position: relative;
    width: 320px;
    height: 320px;
  }
  canvas {
    width: 320px;
    height: 320px;
    border-radius: 12px;
    background: #DFDFDF;
  }
  #timer {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 14px;
    display: none;
  }
  #timer.show { display: block; }
  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
  }
  #switchBtn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #333;
    color: #fff;
    font-size: 22px;
  }
  #recordBtn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #ff3b30;
    border: 5px solid #fff;
  }
  #recordBtn.recording {
    border-radius: 16px;
    background: #ff3b30;
  }
  #status { font-size: 13px; color: #999; text-align: center; max-width: 320px; }
  #resultBox {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: #222;
    padding: 16px;
    border-radius: 12px;
  }
  #resultBox.show { display: flex; }
  #resultVideo {
    width: 240px;
    height: 240px;
    border-radius: 50%;
    object-fit: cover;
    background: #DFDFDF;
  }
  .actionBtn {
    padding: 10px 20px;
    border-radius: 8px;
    background: #FFD700;
    color: #222;
    font-size: 15px;
  }
  .actionBtn.secondary {
    background: #444;
    color: #fff;
  }
  .row { display: flex; gap: 10px; }
</style>
</head>
<body>

<h1>ضبط ویدیو مسیج دایره‌ای</h1>

<div id="stage">
  <canvas id="canvas" width="600" height="600"></canvas>
  <div id="timer">00:00</div>
</div>

<div class="controls">
  <button id="switchBtn" title="چرخش دوربین">⟳</button>
  <button id="recordBtn" title="ضبط"></button>
  <div style="width:50px"></div>
</div>

<div id="status">در حال درخواست دسترسی به دوربین...</div>

<div id="resultBox">
  <video id="resultVideo" autoplay loop muted playsinline></video>
  <div id="formatNote" style="font-size:12px;color:#999;text-align:center;max-width:280px;"></div>
  <div class="row">
    <a id="downloadLink" class="actionBtn" download="video-message.mp4">دانلود ویدیو</a>
    <button id="retakeBtn" class="actionBtn secondary">ضبط مجدد</button>
  </div>
</div>

<video id="hiddenVideo" autoplay playsinline muted style="display:none;"></video>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const hiddenVideo = document.getElementById('hiddenVideo');
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer');
const recordBtn = document.getElementById('recordBtn');
const switchBtn = document.getElementById('switchBtn');
const resultBox = document.getElementById('resultBox');
const resultVideo = document.getElementById('resultVideo');
const downloadLink = document.getElementById('downloadLink');
const retakeBtn = document.getElementById('retakeBtn');
const formatNote = document.getElementById('formatNote');

const BG_COLOR = '#DFDFDF';
const SIZE = 600;
const CIRCLE_D = 560; // قطر دایره داخل قاب مربعی

let currentStream = null;
let facingMode = 'user';
let mediaRecorder = null;
let chunks = [];
let recording = false;
let timerInterval = null;
let seconds = 0;
let rafId = null;
let mixedStream = null;

async function startCamera() {
  statusEl.textContent = 'در حال درخواست دسترسی به دوربین...';
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 720 } },
      audio: true
    });
    hiddenVideo.srcObject = currentStream;
    await hiddenVideo.play();
    statusEl.textContent = 'آماده‌ی ضبط. دکمه قرمز رو بزن.';
    if (!rafId) drawLoop();
  } catch (err) {
    statusEl.textContent = 'خطا در دسترسی به دوربین: ' + err.message;
  }
}

function drawLoop() {
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, SIZE, SIZE);

  if (hiddenVideo.readyState >= 2) {
    const vw = hiddenVideo.videoWidth;
    const vh = hiddenVideo.videoHeight;
    if (vw && vh) {
      // cover-crop حساب کردن مربع از وسط ویدیو
      const side = Math.min(vw, vh);
      const sx = (vw - side) / 2;
      const sy = (vh - side) / 2;

      ctx.save();
      ctx.beginPath();
      ctx.arc(SIZE / 2, SIZE / 2, CIRCLE_D / 2, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      // اگه دوربین جلوعه، آینه‌وار نشون بده (طبیعی‌تره)
      if (facingMode === 'user') {
        ctx.translate(SIZE, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(
        hiddenVideo,
        sx, sy, side, side,
        facingMode === 'user' ? SIZE - CIRCLE_D / 2 - CIRCLE_D / 2 : (SIZE - CIRCLE_D) / 2,
        (SIZE - CIRCLE_D) / 2,
        CIRCLE_D, CIRCLE_D
      );
      ctx.restore();
    }
  }
  rafId = requestAnimationFrame(drawLoop);
}

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
});

function pickMimeType() {
  const candidates = [
    'video/mp4;codecs=h264,aac',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for (const type of candidates) {
    if (MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

function startRecording() {
  chunks = [];
  seconds = 0;
  timerEl.textContent = '00:00';
  timerEl.classList.add('show');

  const canvasStream = canvas.captureStream(30);
  const audioTrack = currentStream.getAudioTracks()[0];
  if (audioTrack) canvasStream.addTrack(audioTrack);
  mixedStream = canvasStream;

  const mimeType = pickMimeType();
  const options = mimeType ? { mimeType } : {};
  mediaRecorder = new MediaRecorder(mixedStream, options);

  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;

  mediaRecorder.start();
  recording = true;
  recordBtn.classList.add('recording');
  statusEl.textContent = 'در حال ضبط...';

  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
    if (seconds >= 60) stopRecording(); // حداکثر ۶۰ ثانیه مثل تلگرام
  }, 1000);
}

function stopRecording() {
  if (mediaRecorder && recording) {
    mediaRecorder.stop();
  }
  recording = false;
  recordBtn.classList.remove('recording');
  clearInterval(timerInterval);
  timerEl.classList.remove('show');
}

function onRecordingStop() {
  const usedType = mediaRecorder.mimeType || 'video/webm';
  const blob = new Blob(chunks, { type: usedType });
  const url = URL.createObjectURL(blob);

  resultVideo.src = url;
  downloadLink.href = url;

  const isMp4 = usedType.includes('mp4');
  downloadLink.download = isMp4 ? 'video-message.mp4' : 'video-message.webm';

  if (isMp4) {
    formatNote.textContent = 'فرمت خروجی: MP4 ✓ — مستقیماً قابل ارسال در تلگرام و اینستاگرامه.';
  } else {
    formatNote.textContent = 'مرورگرت فقط WebM ضبط می‌کنه، نه MP4. اگه می‌خوای حتماً MP4 باشه، این فایل رو با یک مبدل آنلاین (مثل CloudConvert) یا اگه مک/آیفون داری با Safari ضبط کن.';
  }

  resultBox.classList.add('show');
  document.getElementById('stage').style.display = 'none';
  document.querySelector('.controls').style.display = 'none';
  statusEl.style.display = 'none';
}

recordBtn.addEventListener('click', () => {
  if (!recording) startRecording();
  else stopRecording();
});

retakeBtn.addEventListener('click', () => {
  resultBox.classList.remove('show');
  document.getElementById('stage').style.display = 'block';
  document.querySelector('.controls').style.display = 'flex';
  statusEl.style.display = 'block';
  statusEl.textContent = 'آماده‌ی ضبط. دکمه قرمز رو بزن.';
});

startCamera();
</script>
</body>
</html>
